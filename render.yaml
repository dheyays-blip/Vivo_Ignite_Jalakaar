# JALAAKAR — Render blueprint.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Render reads this file and creates the service; nothing to click through.
#
# WHAT HAPPENS AT BUILD TIME
# --------------------------
# 1. size check          data/bootstrap/*.parquet are Git LFS files. Render's
#                        CLONE resolves them, but the BUILD environment has no
#                        `git lfs` binary at all — an earlier version of this
#                        file called it and died with "'lfs' is not a git
#                        command". So there is nothing to pull here; there is
#                        only something to VERIFY.
#
#                        The check matters because the failure it guards is
#                        silent. If the Parquet arrives as a 131-byte pointer,
#                        bootstrap.py cheerfully builds a database with zero
#                        weather rows, every endpoint keeps answering, and the
#                        scores quietly stop matching the published MAE. A red
#                        build is strictly better than that.
#
#                        If the pointer case ever does happen, fetch the real
#                        bytes over plain HTTPS instead of failing outright —
#                        GitHub serves LFS content from media.githubusercontent
#                        .com and curl needs no LFS client. Verified: all three
#                        return 200 with the correct byte counts. Only if THAT
#                        also fails does the build stop.
# 2. pip install         requirements-deploy.txt, not requirements.txt. See
#                        that file for why (1.3 GB -> 533 MB).
# 3. bootstrap.py        builds data/jalaakar.db, 490 MB, ~40 s. This runs in
#                        the BUILD, so the finished database is baked into the
#                        deployed image. It is not rebuilt when the service
#                        wakes from a spin-down.
#
# MEMORY
# ------
# The build peaks at 220 MB and the server idles at 179 MB with the model
# loaded, so this fits a 512 MB instance. It did not before: loading
# weather_daily with pd.read_parquet peaked at 2336 MB and would have been
# OOM-killed here every time. tools/bootstrap.py now streams it in batches.

services:
  - type: web
    name: jalaakar
    runtime: python
    plan: free
    region: singapore          # closest to Maharashtra of Render's regions
    branch: main

    buildCommand: |
      set -e

      # No `git lfs` here — it does not exist in this environment. Verify what
      # the clone delivered, and repair over HTTPS if it delivered pointers.
      # A pointer file is ~130 bytes; the real weather series is 28 MB.
      SIZE=$(stat -c%s data/bootstrap/weather_daily.parquet 2>/dev/null || echo 0)
      if [ "$SIZE" -lt 1000000 ]; then
        echo "weather_daily.parquet is $SIZE bytes — LFS pointers, not data."
        echo "Fetching the real files over HTTPS instead."
        for f in wells gw_observations weather_daily; do
          curl -fsSL -o "data/bootstrap/$f.parquet" \
            "https://media.githubusercontent.com/media/dheyays-blip/Vivo_Ignite_Jalakaar/main/data/bootstrap/$f.parquet"
          echo "  $f.parquet $(stat -c%s data/bootstrap/$f.parquet) bytes"
        done
        SIZE=$(stat -c%s data/bootstrap/weather_daily.parquet)
      fi
      if [ "$SIZE" -lt 1000000 ]; then
        echo "FATAL: weather_daily.parquet is still $SIZE bytes."
        echo "Stopping rather than shipping a site that scores against an"
        echo "empty weather table while advertising the published MAE."
        exit 1
      fi
      echo "weather_daily.parquet OK — $SIZE bytes"

      pip install --upgrade pip
      pip install -r requirements-deploy.txt
      python tools/bootstrap.py

      # Demo accounts, baked into the image.
      #
      # A fresh app.db has no users, so the control room has nothing to sign
      # in with and "broadcast to all subscribers" reaches nobody — a visitor
      # cannot see the half of the product that matters. Seeding at BUILD time
      # rather than at startup means the accounts are part of the image, so
      # they survive the free plan's spin-down cycle exactly as the database
      # does. seed_demo.py skips users that already exist, so re-running it on
      # every deploy is safe.
      #
      # Sign in at /login.html as 9800000001 / jalaakar-demo for the
      # government role. All five accounts are openly fake — placeholder names
      # in the 98000000xx block — and `make reset` clears them.
      python tools/seed_demo.py

    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      # Where user signups live. On the free plan this is ephemeral — see the
      # note in the deploy write-up. Set to a mounted disk path on a paid plan.
      - key: JALAAKAR_APP_DB
        sync: false
      # Optional — real WhatsApp delivery. Left unset, alerts are rendered and
      # logged honestly as 'console'/'rendered' rather than claimed as sent.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
