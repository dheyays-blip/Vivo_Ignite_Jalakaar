# JALAAKAR — ingestion config
# SHARED FILE. Agree changes with the other dev before editing.

project: jalaakar

scenario:
  date: 2026-06-30          # pre-monsoon demo scenario
  demo_taluka: Dindori
  demo_district: Nashik

geography:
  state: Maharashtra
  # accepted spelling variants when filtering source data
  state_aliases: [Maharashtra, MAHARASHTRA, Maharastra, MAHARASTRA, maharashtra]
  bbox:                      # lat/lon bounding box
    lat_min: 15.6
    lat_max: 22.1
    lon_min: 72.6
    lon_max: 80.9

dates:
  # Groundwater observations actually run 2000-01 -> 2023-08 (CGWB measures 4x/yr:
  # Jan, May, Aug, Nov). May-20 and May-21 are 100% null — COVID killed both
  # pre-monsoon rounds. Revised 7 Aug after A1/A2; original values assumed
  # coverage to 2026, which does not exist in any available source.
  last5_start: 2018-08-01    # 5 years back from the TRUE end date, not from today
  history: max_available
  gw_end: 2023-08-15         # last real groundwater observation
  end_date: 2026-08-07       # weather + reservoirs run to present

seasons:                     # month -> season
  pre_monsoon:  [3, 4, 5]
  monsoon:      [6, 7, 8, 9]
  post_monsoon: [10, 11]
  rabi:         [12, 1, 2]

splits:                      # chronological, NEVER random
  # Revised 7 Aug to fit real coverage. The original 2024/2025/2026 boundaries
  # produced EMPTY val and test sets — silently, with no error.
  train_end: 2020-11-30      # ~83 quarterly rounds, 2000-2020
  val_end:   2022-06-30      # Jan-21, Aug-21, Nov-21, Jan-22, May-22
  test_end:  2023-08-31      # Aug-22, Nov-22, Jan-23, May-23, Aug-23
  # Test deliberately contains a May (pre-monsoon) round — same season as the
  # 30 Jun 2026 demo scenario.

sources:
  figshare_doi: 10.6084/m9.figshare.29293877.v3
  openmeteo_archive: https://archive-api.open-meteo.com/v1/archive
  openmeteo_sleep_s: 0.5
  coord_dedupe_deg: 0.1

paths:
  raw: data/raw
  interim: data/interim
  db: data/jalaakar.db
  cache: .cache/http
