# JALAAKAR — ingestion config
# SHARED FILE. Agree changes with the other dev before editing.

project: jalaakar

scenario:
  date: 2026-06-30          # pre-monsoon demo scenario
  demo_taluka: Dindori
  demo_district: Nashik

geography:
  state: Maharashtra
  # accepted spelling variants when filtering source data
  state_aliases: [Maharashtra, MAHARASHTRA, Maharastra, MAHARASTRA, maharashtra]
  bbox:                      # lat/lon bounding box
    lat_min: 15.6
    lat_max: 22.1
    lon_min: 72.6
    lon_max: 80.9

dates:
  # Groundwater observations actually run 2000-01 -> 2023-08 (CGWB measures 4x/yr:
  # Jan, May, Aug, Nov). May-20 and May-21 are 100% null — COVID killed both
  # pre-monsoon rounds. Revised 7 Aug after A1/A2; original values assumed
  # coverage to 2026, which does not exist in any available source.
  last5_start: 2018-08-01    # 5 years back from the TRUE end date, not from today
  history: max_available
  gw_end: 2023-08-15         # last real groundwater observation
  end_date: 2026-08-07       # weather + reservoirs run to present
  # Recession rates are fitted from a well's FULL record (all 24 years of dry
  # intervals — 69k observations, cheap). Only the daily curve is materialised
  # from here, which takes gw_daily from ~8.1M rows to ~3.4M and keeps
  # 06_features inside memory. Train still spans 2013->2020: ~32 quarterly
  # rounds including 7 pre-monsoon Mays, which matters because the demo
  # scenario (30 June) is pre-monsoon.
  daily_start: 2013-01-01
  # Weather before this is fetched and never read: gw_daily starts 2013-01-01
  # and the longest lag/rolling window is 90d (120d buffer). Flooring here cuts
  # each Open-Meteo call from 8,793 days to 4,058.
  history_floor: 2012-09-03  # was 1990-01-01 [B]; nothing older is ever read

seasons:                     # month -> season
  pre_monsoon:  [3, 4, 5]
  monsoon:      [6, 7, 8, 9]
  post_monsoon: [10, 11]
  rabi:         [12, 1, 2]

splits:                      # chronological, NEVER random
  # Revised 7 Aug to fit real coverage. The original 2024/2025/2026 boundaries
  # produced EMPTY val and test sets — silently, with no error.
  train_end: 2020-11-30      # ~83 quarterly rounds, 2000-2020
  val_end:   2022-06-30      # Jan-21, Aug-21, Nov-21, Jan-22, May-22
  test_end:  2023-08-31      # Aug-22, Nov-22, Jan-23, May-23, Aug-23
  # Test deliberately contains a May (pre-monsoon) round — same season as the
  # 30 Jun 2026 demo scenario.

sources:
  figshare_doi: 10.6084/m9.figshare.29293877.v3
  openmeteo_archive: https://archive-api.open-meteo.com/v1/archive
  openmeteo_sleep_s: 0.5
  # 0.25 deg == ERA5's native archive resolution. At 0.1 deg the 940 wells need
  # 817 cells; at 0.25 they need 363. Wells up to ~28 km apart then share one
  # rainfall series — a real but small accuracy cost, and the alternative was a
  # 9-12 hour fetch. Drop back to 0.1 if you ever have the time budget.
  coord_dedupe_deg: 0.25
  # [B] added 7 Aug — request hardening for 03_openmeteo.py
  openmeteo_timeout_s: 60
  openmeteo_max_retries: 4
  openmeteo_timezone: Asia/Kolkata

# ---------------------------------------------------------------------------
# [B] added 7 Aug for 03/04/06. Nothing above this line was changed except the
# four lines marked [B]. Feature-engineering knobs live here rather than inside
# 06_features.py so the ML track can retune them without editing ingest code.
# ---------------------------------------------------------------------------
features:
  target_horizon_days: 30    # predict level at t+30
  lags: [7, 15, 30, 60, 90]
  rolling_windows: [7, 30, 90]
  rain_day_mm: 2.5           # threshold for days_since_last_rain
  monsoon_start_month: 6     # cum_monsoon_rainfall resets 1 June

urban:
  # The reservoir series is ~1 season of published aggregates — far too short
  # to train on. Every urban row is labelled 'test' so it can never leak into
  # a training set. Rural splits above are unaffected.
  all_test: true

paths:
  raw: data/raw
  interim: data/interim
  db: data/jalaakar.db
  cache: .cache/http
  reports: reports          # [B] validate.py writes plots here
